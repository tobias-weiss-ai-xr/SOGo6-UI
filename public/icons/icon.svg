    <line x1="60" y1="210" x2="180" y2="210" stroke="white" stroke-width="6"/>
    <line x1="90" y1="170" x2="90" y2="190" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="170" x2="150" y2="190" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- Contact icon -->
